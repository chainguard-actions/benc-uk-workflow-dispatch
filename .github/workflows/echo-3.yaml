name: Message Echo 3

# A version using workflow_call for investigation purposes

on: 
  workflow_call:
    inputs:
      message:
        required: false
        default: "this is echo 3"
        type: string
        description: "Message to echo"

permissions: {}

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Echo message
        env:
          MESSAGE: ${{ inputs.message }}
        run: echo "$MESSAGE"
