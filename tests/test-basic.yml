name: Test basic workflow dispatch invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke workflow dispatch (expect failure with invalid token)
        id: dispatch
        uses: .
        with:
          workflow: test.yml
          token: fake-token-for-testing
          repo: octocat/Hello-World
          ref: main
        continue-on-error: true

      - name: Assert step failed due to invalid token
        env:
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: step correctly failed with invalid token"
