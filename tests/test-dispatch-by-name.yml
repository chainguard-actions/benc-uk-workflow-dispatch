name: Test workflow dispatch with invalid JSON inputs fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dispatch workflow with invalid JSON inputs (expect failure)
        id: dispatch
        uses: .
        with:
          workflow: some-workflow.yaml
          inputs: 'this is not valid json {'
        continue-on-error: true

      - name: Assert action failed for invalid JSON inputs
        env:
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid JSON inputs, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid JSON inputs"
