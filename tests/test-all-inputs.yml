name: Test all optional inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all optional inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          workflow: my-workflow.yml
          token: invalid-token-for-testing
          repo: octocat/Hello-World
          ref: main
          inputs: '{"key": "value", "another": "input"}'
          wait-for-completion: false
          wait-timeout-seconds: 300
          wait-interval-seconds: 10
          sync-status: false

      - name: Assert action failed at API call (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed all inputs and failed at API call stage"
