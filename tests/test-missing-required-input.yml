name: Test missing required workflow input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          workflow: nonexistent-workflow-xyz-12345.yml
          token: invalid-token-for-testing
          repo: nonexistent-owner-xyz/nonexistent-repo-xyz

      - name: Assert action failed due to invalid inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with nonexistent workflow/repo, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with nonexistent workflow/repo"
