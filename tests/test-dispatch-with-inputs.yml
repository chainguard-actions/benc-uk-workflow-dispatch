name: Test workflow dispatch with JSON inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that valid JSON inputs are accepted by the action.
      # The action parses the inputs field as JSON before making API calls.
      # Valid JSON should not cause a JSON parse error.
      # Under act, the dispatch itself may fail (ref doesn't exist on remote),
      # but the action should get past the JSON parsing step.
      - name: Dispatch workflow with valid JSON inputs
        id: action
        uses: .
        with:
          workflow: test-dispatch-with-inputs.yml
          repo: ${{ github.repository }}
          inputs: '{"message": "hello from test"}'
        continue-on-error: true

      - name: Assert action ran (valid JSON accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run and either succeed or fail gracefully.
          # Under act, dispatch will fail because the ref (act-harness) doesn't
          # exist on the remote, or the workflow isn't in .github/workflows/.
          # We just verify the action ran (not skipped/cancelled).
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly skipped or cancelled"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME (valid JSON was accepted)"
