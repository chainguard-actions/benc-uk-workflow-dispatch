name: Test basic invocation with invalid token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          workflow: some-workflow.yml
          token: invalid-token-for-testing
          repo: octocat/Hello-World
          ref: main

      - name: Assert action failed due to invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
