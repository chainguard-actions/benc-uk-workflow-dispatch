name: Test valid JSON inputs - action proceeds past JSON parsing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke workflow dispatch with valid JSON inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          workflow: some-workflow.yml
          token: invalid-token-for-testing
          repo: octocat/Hello-World
          ref: main
          inputs: '{ "message": "hello world", "debug": "true" }'

      - name: Assert action failed at API stage (not JSON parse stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of the invalid token (API error),
          # not because of JSON parsing. Either way, outcome should be 'failure'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at API call stage), got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at API stage with valid JSON inputs"
