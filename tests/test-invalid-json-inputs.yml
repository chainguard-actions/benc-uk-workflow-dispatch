name: Test invalid JSON inputs error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action parses the inputs field as JSON before making any API call.
      # Providing invalid JSON should cause the action to fail immediately with
      # a JSON parse error, before any network request is made.
      - name: Dispatch workflow with invalid JSON inputs (expect failure)
        id: action
        uses: .
        with:
          workflow: test-invalid-json-inputs.yml
          repo: ${{ github.repository }}
          inputs: 'not valid json at all'
        continue-on-error: true

      - name: Assert action failed due to invalid JSON
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid JSON inputs, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid JSON inputs"
