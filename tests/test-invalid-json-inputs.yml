name: Test invalid JSON inputs - action fails with parse error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke workflow dispatch with invalid JSON inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          workflow: some-workflow.yml
          token: invalid-token-for-testing
          repo: octocat/Hello-World
          ref: main
          inputs: "this is not valid json {"

      - name: Assert action failed due to invalid JSON
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid JSON inputs, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid JSON inputs"
