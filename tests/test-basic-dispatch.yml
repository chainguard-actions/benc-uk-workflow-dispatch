name: Test basic workflow dispatch
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action dispatches workflows via the GitHub API.
      # Under act, the ref 'act-harness' does not exist on the remote GitHub repo,
      # so the dispatch API call will fail. However, we can still verify that the
      # action correctly processes inputs and attempts to find/dispatch the workflow.
      # We use 'continue-on-error: true' so the job continues regardless of outcome.
      - name: Dispatch workflow by filename
        id: action
        uses: .
        with:
          workflow: test-basic-dispatch.yml
          repo: ${{ github.repository }}
        continue-on-error: true

      - name: Assert action ran (smoke test)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run and either succeed or fail gracefully.
          # Under act, dispatch will fail because the ref (act-harness) doesn't
          # exist on the remote, or the workflow isn't in .github/workflows/.
          # We just verify the action ran (not skipped/cancelled).
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly skipped or cancelled"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
