name: Test basic workflow dispatch - non-existent workflow fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dispatch non-existent workflow (expect failure)
        id: dispatch
        uses: .
        with:
          workflow: this-workflow-does-not-exist-at-all.yaml
        continue-on-error: true

      - name: Assert action failed for non-existent workflow
        env:
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent workflow, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent workflow"
