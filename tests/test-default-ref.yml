name: Test default ref behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
      GITHUB_HEAD_REF: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without explicit ref (uses default)
        id: action
        uses: .
        continue-on-error: true
        with:
          workflow: some-workflow.yml
          token: invalid-token-for-testing
          repo: octocat/Hello-World

      - name: Assert action ran (failed at API, not at ref resolution)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly resolved default ref and failed at API call stage"

      - name: Run action with pull_request context (uses head_ref as default)
        id: action-pr
        uses: .
        continue-on-error: true
        env:
          GITHUB_HEAD_REF: feature-branch
          GITHUB_BASE_REF: main
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
        with:
          workflow: some-workflow.yml
          token: invalid-token-for-testing
          repo: octocat/Hello-World

      - name: Assert PR context action ran (failed at API, not at ref resolution)
        env:
          OUTCOME: ${{ steps.action-pr.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly resolved head_ref in PR context and failed at API call stage"
